name: Patch Airbnb parser

on:
  push:
    paths:
      - '.github/workflows/patch-airbnb-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch Airbnb parsing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.index('async function fetchPreview(){')
          end = s.index('function setStatus', start)
          new = r'''function getAirbnbListing(url){
            try{
              const u=new URL(url);
              if(!u.hostname.toLowerCase().includes('airbnb.')) return null;
              const m=u.pathname.match(/\/rooms\/(\d+)/i);
              if(!m) return null;
              return {id:m[1],canonical:`https://www.airbnb.com/rooms/${m[1]}`};
            }catch{return null}
          }
          function isGenericAirbnbTitle(title=''){
            return /^(airbnb\b|holiday rentals\b)|holiday rentals|cabins, beach houses|unique homes\s*&\s*experiences/i.test(title.trim());
          }
          function inferAirbnbTitle(description=''){
            const d=description.replace(/\*\*/g,' ').replace(/\s+/g,' ').trim();
            let m=d.match(/welcome to the\s+(.+?)\s+at\s+([^,.!]+)[,.!]/i);
            if(m) return `${m[2].trim()} | ${m[1].trim()}`;
            m=d.match(/welcome to\s+([^.!]{4,90})[.!]/i);
            return m?m[1].trim():'';
          }
          async function microlinkPreview(target,airbnb=false){
            const q=new URLSearchParams({url:target});
            if(airbnb){
              q.set('prerender','true');
              q.set('data.airbnbTitle.selector','h1');
              q.set('data.airbnbTitle.attr','text');
              q.set('data.airbnbImage.evaluate',`Array.from(document.images).map(i=>i.currentSrc||i.src).find(src=>src&&src.includes('muscache.com/im/pictures/'))||''`);
              q.set('data.airbnbImage.type','url');
              q.set('data.airbnbText.selector','main');
              q.set('data.airbnbText.attr','text');
            }
            const res=await fetch('https://api.microlink.io/?'+q.toString(),{headers:{accept:'application/json'}});
            if(!res.ok) throw new Error('Preview service returned '+res.status);
            const json=await res.json();
            if(json.status!=='success'||!json.data) throw new Error(json.message||'Could not read this page');
            return json.data;
          }
          async function fetchPreview(){
            const url=$('link').value.trim();
            if(!/^https?:\/\//i.test(url)){setStatus('Paste a full link beginning with http:// or https://','err');return}
            $('parseBtn').disabled=true;$('parseBtn').textContent='Fetching…';setStatus('Reading the link…');
            try{
              const airbnb=getAirbnbListing(url);
              const target=airbnb?airbnb.canonical:url;
              const d=await microlinkPreview(target,!!airbnb);
              const description=(d.description||'').trim();
              let title=(typeof d.airbnbTitle==='string'&&d.airbnbTitle.trim())||d.title||d.publisher||hostLabel(url);
              if(airbnb&&isGenericAirbnbTitle(title)) title=inferAirbnbTitle(description)||`Airbnb stay #${airbnb.id}`;
              let image='';
              if(typeof d.airbnbImage==='string') image=d.airbnbImage;
              else if(d.airbnbImage&&d.airbnbImage.url) image=d.airbnbImage.url;
              if(!image) image=(d.image&&d.image.url)||'';
              draftImage=image; draftSource=airbnb?'Airbnb':(d.publisher||hostLabel(url));
              $('nt').value=title||'';
              $('nn').value=description.slice(0,260);
              $('type').value=guessType(url,title);
              const px=extractPrice(description); if(px)$('np').value=px;
              $('prevTitle').textContent=title;
              $('prevSource').textContent=draftSource+(airbnb?' · listing '+airbnb.id:'');
              if(image){$('prevImg').src=image;$('prevImg').style.display='block'}else{$('prevImg').removeAttribute('src');$('prevImg').style.background='#f2f2f2'}
              $('linkPreview').classList.add('show');
              if(airbnb){
                setStatus('Airbnb listing read from its canonical room page. Check the photo/title below. Price may stay blank unless the shared URL includes dates and pricing.','ok');
              }else{
                setStatus('Preview found. Check the details below before adding it.','ok');
              }
            }catch(err){
              draftImage='';draftSource=hostLabel(url);
              $('type').value=guessType(url);
              setStatus('I could not fully read that page. You can still add the link manually below. '+err.message,'err');
            }finally{
              $('parseBtn').disabled=false;$('parseBtn').textContent='Fetch';
            }
          }
          '''
          p.write_text(s[:start] + new + s[end:])
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Improve Airbnb listing parsing"
          git push
