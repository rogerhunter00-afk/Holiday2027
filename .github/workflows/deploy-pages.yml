name: Deploy Holiday 2027 demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Add UI polish layer
        run: |
          python - <<'PY'
          from pathlib import Path

          def inject(path, tags):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              for tag in tags:
                  if tag not in s:
                      s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)

          inject('index.html', [
              '<script src="./ui-polish.js"></script>',
              '<script src="./people-page.js"></script>',
              '<script src="./app-shell.js"></script>',
          ])

          inject('flight-natural-language-test.html', [
              '<script src="./flight-results-polish.js"></script>',
              '<script src="./flight-price-check-polish.js"></script>',
          ])
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
