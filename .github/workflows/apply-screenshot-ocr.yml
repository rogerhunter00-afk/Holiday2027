name: Apply screenshot OCR

on:
  push:
    paths:
      - '.github/workflows/apply-screenshot-ocr.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace index with screenshot OCR version
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          data = ''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add screenshot price OCR" || exit 0
          git push
