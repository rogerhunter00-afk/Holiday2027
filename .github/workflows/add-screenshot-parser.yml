name: Add screenshot parser

on:
  push:
    paths:
      - '.github/workflows/add-screenshot-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add screenshot upload and OCR
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          css_marker='.previewtext span{display:block;color:var(--muted);font-size:11px;margin-top:5px}'
          css_add='''.steps{display:grid;gap:14px;margin-top:16px}.step{border:1px solid var(--line);border-radius:20px;padding:15px;background:#fff}.stephead{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}.stepnum{width:28px;height:28px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}.stephead b{display:block;font-size:14px}.stephead span{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}.shotbox{position:relative;border:1.5px dashed #cfcfcf;border-radius:16px;min-height:112px;padding:14px;background:#fafafa;display:flex;align-items:center;gap:12px}.shotbox.has{border-style:solid;background:#fff}.shotthumb{width:74px;height:92px;border-radius:11px;object-fit:cover;background:#eee;display:none;flex:0 0 auto}.shotbox.has .shotthumb{display:block}.shotcopy{min-width:0}.shotcopy b{display:block;font-size:13px}.shotcopy span{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:4px}.shotinput{position:absolute;inset:0;opacity:0;cursor:pointer}.ocrrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.ocrprogress{height:5px;border-radius:999px;background:#eee;overflow:hidden;margin-top:9px;display:none}.ocrprogress.show{display:block}.ocrbar{height:100%;width:0;background:#222;transition:width .15s}.found{display:none;margin-top:10px;border-radius:14px;background:#f5f8ff;padding:10px 11px;font-size:12px;line-height:1.45}.found.show{display:block}.privacy{margin-top:9px;color:#888;font-size:11px;line-height:1.4}.factsline{color:var(--muted);font-size:13px;line-height:1.4;margin:5px 0 0}.pp{font-weight:800;color:#444}.mutednote{font-size:11px;color:#888;margin-top:6px;line-height:1.35}'''
          if css_add not in s:
            s=s.replace(css_marker,css_marker+css_add)

          s=s.replace('Paste links, compare them and vote','Share links + price screenshots, compare and vote')
          s=s.replace('Start fresh by pasting the first Airbnb, flight or activity link. We’ll try to build the card automatically.','Add the first option with its share link. For Airbnb, add the booking-summary screenshot too so we can read the dates, guests and total cost.')

          modal='''<h2>Add a holiday option</h2><p>For Airbnb, use the share link for the listing and a screenshot of the booking summary. The link gives us the property; the screenshot gives us the actual dates, guest count and total cost.</p><div class="steps"><div class="step"><div class="stephead"><span class="stepnum">1</span><div><b>Paste the share link</b><span>Airbnb, Booking.com, Skyscanner, Google Flights or another travel link.</span></div></div><div class="field" style="margin-top:0"><label>Share link <small>required</small></label><div class="linkrow"><input id="link" type="url" placeholder="https://www.airbnb.co.uk/rooms/..."><button class="parse" id="parseBtn" type="button">Fetch</button></div></div><div class="status" id="status"></div><div class="previewcard" id="linkPreview"><img id="prevImg" alt=""><div class="previewtext"><b id="prevTitle"></b><span id="prevSource"></span></div></div></div><div class="step"><div class="stephead"><span class="stepnum">2</span><div><b>Add the price screenshot</b><span>On Airbnb, select the dates and guests, then screenshot the summary showing <strong>Dates</strong>, <strong>Guests</strong> and <strong>Total price</strong>.</span></div></div><label class="shotbox" id="shotBox"><img class="shotthumb" id="shotThumb" alt="Screenshot preview"><div class="shotcopy"><b id="shotName">Choose screenshot</b><span>Pick it from Photos. A cropped booking-summary screenshot works best.</span></div><input class="shotinput" id="screenshot" type="file" accept="image/*"></label><div class="ocrrow"><div class="mutednote">We read this on your device and keep only the extracted trip details.</div><button class="parse" id="ocrBtn" type="button" disabled>Read screenshot</button></div><div class="ocrprogress" id="ocrProgress"><div class="ocrbar" id="ocrBar"></div></div><div class="found" id="ocrFound"></div><div class="privacy">Do not upload screenshots containing card numbers or other payment details. The booking summary section is enough.</div></div></div><div class="field"><label>Type</label><select id="type"><option value="stay">Stay</option><option value="flight">Flight</option><option value="activity">Thing to do</option></select></div><div class="field"><label>Title</label><input id="nt" placeholder="We’ll try to fill this from the link"></div><div class="field"><label>Dates <small>from screenshot</small></label><input id="nd" placeholder="e.g. 8–15 May 2027"></div><div class="field"><label>Guests <small>from screenshot</small></label><input id="ng" placeholder="e.g. 8 adults"></div><div class="field"><label>Total price <small>from screenshot</small></label><input id="np" placeholder="e.g. £1,788.75 total"></div><div class="field"><label>Approx. per person <small>calculated</small></label><input id="npp" placeholder="e.g. £223.59 pp"></div><div class="field"><label>Quick note <small>optional</small></label><textarea id="nn" rows="3" placeholder="Pool, near town, free cancellation..."></textarea></div>'''
          s=re.sub(r'<h2>Add a link</h2>.*?(?=<button class="primary" id="save">)',modal,s,count=1,flags=re.S)

          s=s.replace("let draftImage='',draftSource='',currentFilter='all';","let draftImage='',draftSource='',currentFilter='all',screenshotFile=null,screenshotUrl='';")
          s=s.replace("let draftImage='', draftSource='', currentFilter='all';","let draftImage='', draftSource='', currentFilter='all', screenshotFile=null, screenshotUrl='';")

          card_old='''<div class="row"><h3>${esc(o.title||'Untitled option')}</h3><span class="price">${esc(o.price||'')}</span></div>${o.note?`<p class="sub">${esc(o.note)}</p>`:''}<a class="openlink" href="${esc(o.url)}" target="_blank" rel="noopener">Open original ↗</a>'''
          card_new='''<div class="row"><h3>${esc(o.title||'Untitled option')}</h3><span class="price">${esc(o.price||'')}</span></div>${(o.dates||o.guests)?`<p class="factsline">${[o.dates,o.guests].filter(Boolean).map(esc).join(' · ')}</p>`:''}${o.perPerson?`<p class="factsline pp">${esc(o.perPerson)}</p>`:''}${o.cancellation?`<p class="factsline">✓ ${esc(o.cancellation)}</p>`:''}${o.note?`<p class="sub">${esc(o.note)}</p>`:''}<a class="openlink" href="${esc(o.url)}" target="_blank" rel="noopener">Open original ↗</a>'''
          s=s.replace(card_old,card_new)

          ocr=r'''$('screenshot').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;screenshotFile=f;if(screenshotUrl)URL.revokeObjectURL(screenshotUrl);screenshotUrl=URL.createObjectURL(f);$('shotThumb').src=screenshotUrl;$('shotName').textContent=f.name||'Screenshot selected';$('shotBox').classList.add('has');$('ocrBtn').disabled=false;$('ocrFound').classList.remove('show');$('ocrBar').style.width='0%'});function loadTesseract(){if(window.Tesseract)return Promise.resolve();if(window.__tesseractLoading)return window.__tesseractLoading;window.__tesseractLoading=new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Could not load the on-device text reader'));document.head.appendChild(sc)});return window.__tesseractLoading}function cleanOcrLine(s=''){return s.replace(/[|]/g,'I').replace(/\s+/g,' ').trim()}function nextUseful(lines,i){for(let j=i+1;j<Math.min(lines.length,i+4);j++)if(lines[j])return lines[j];return''}function moneyNumber(v=''){const n=parseFloat(v.replace(/[^0-9.]/g,'').replace(/,(?=\d{3}\b)/g,''));return Number.isFinite(n)?n:null}function parseSummaryText(raw=''){const lines=raw.split(/\r?\n/).map(cleanOcrLine).filter(Boolean),flat=lines.join(' ');let dates='',guests='',price='',title='',cancellation='';const di=lines.findIndex(x=>/^dates?$/i.test(x)||/^dates?\b/i.test(x));if(di>=0){const c=(/^dates?$/i.test(lines[di])?nextUseful(lines,di):lines[di].replace(/^dates?\s*/i,''));if(/\d/.test(c))dates=c}if(!dates){const m=flat.match(/\b(\d{1,2}\s*[–—-]\s*\d{1,2}\s+[A-Za-z]{3,9}\s+20\d{2})\b/i)||flat.match(/\b(\d{1,2}\s+[A-Za-z]{3,9}\s*[–—-]\s*\d{1,2}\s+[A-Za-z]{3,9}\s+20\d{2})\b/i);if(m)dates=m[1].replace(/\s*[-–—]\s*/,'–')}const gi=lines.findIndex(x=>/^guests?$/i.test(x)||/^guests?\b/i.test(x));if(gi>=0){const c=(/^guests?$/i.test(lines[gi])?nextUseful(lines,gi):lines[gi].replace(/^guests?\s*/i,'')),gm=c.match(/\b(\d+)\s*(adults?|guests?|people|persons?)\b/i);if(gm)guests=gm[1]+' '+gm[2].toLowerCase()}if(!guests){const gm=flat.match(/\b(\d+)\s*(adults?|guests?|people|persons?)\b/i);if(gm)guests=gm[1]+' '+gm[2].toLowerCase()}const pi=lines.findIndex(x=>/total\s*price/i.test(x));if(pi>=0){const around=[lines[pi],nextUseful(lines,pi),lines[pi+2]||''].join(' '),pm=around.match(/(?:£|GBP\s*)([\d,]+(?:\.\d{1,2})?)/i);if(pm)price='£'+pm[1]+' total'}if(!price){const pm=flat.match(/(?:£|GBP\s*)([\d,]+(?:\.\d{1,2})?)\s*(?:GBP)?/i);if(pm)price='£'+pm[1]+' total'}if(/free\s+cancellation/i.test(flat))cancellation='Free cancellation';const stop=lines.findIndex(x=>/^dates?$/i.test(x)||/\b4[.,]\d{1,2}\b/.test(x)||/guest\s+favourite/i.test(x)),head=lines.slice(0,stop>0?stop:Math.min(5,lines.length)).filter(x=>!/^airbnb$/i.test(x)&&!/^reserve$/i.test(x)&&!/^share$/i.test(x));if(head.length){const likely=head.filter(x=>/[A-Za-z]{3}/.test(x)&&x.length>4).slice(-2);title=likely.join(' ').replace(/\s+/g,' ').trim()}const countMatch=guests.match(/\d+/),count=countMatch?parseInt(countMatch[0],10):null,total=moneyNumber(price),perPerson=(count&&total)?`£${(total/count).toFixed(2)} pp`:'';return{dates,guests,price,perPerson,title,cancellation}}function isUsefulScreenshotTitle(t=''){return t.length>=6&&t.length<120&&!/^(dates?|guests?|total price|free cancellation|choose when to pay)/i.test(t)}$('ocrBtn').onclick=async()=>{if(!screenshotFile)return;$('ocrBtn').disabled=true;$('ocrBtn').textContent='Reading…';$('ocrProgress').classList.add('show');$('ocrBar').style.width='4%';try{await loadTesseract();const result=await Tesseract.recognize(screenshotFile,'eng',{logger:m=>{if(m.status==='recognizing text'&&m.progress!=null)$('ocrBar').style.width=Math.max(5,Math.round(m.progress*100))+'%'}});$('ocrBar').style.width='100%';const found=parseSummaryText(result?.data?.text||'');if(found.dates)$('nd').value=found.dates;if(found.guests)$('ng').value=found.guests;if(found.price)$('np').value=found.price;if(found.perPerson)$('npp').value=found.perPerson;if(found.cancellation&&!$('nn').value.trim())$('nn').value=found.cancellation;if((!$('nt').value.trim()||isGenericAirbnbTitle($('nt').value))&&isUsefulScreenshotTitle(found.title))$('nt').value=found.title;const pieces=[found.dates,found.guests,found.price,found.perPerson,found.cancellation].filter(Boolean);$('ocrFound').innerHTML=pieces.length?`<b>Found from screenshot:</b><br>${pieces.map(esc).join(' · ')}`:'I could read the screenshot but could not confidently identify the dates, guests or total. You can fill them in below.';$('ocrFound').classList.add('show');toast(pieces.length?'Screenshot details found':'Screenshot read')}catch(err){$('ocrFound').textContent='Could not read this screenshot: '+err.message;$('ocrFound').classList.add('show')}finally{$('ocrBtn').disabled=false;$('ocrBtn').textContent='Read screenshot';setTimeout(()=>$('ocrProgress').classList.remove('show'),500)}};
'''
          if "$('screenshot').addEventListener" not in s:
            s=s.replace("$('save').onclick=()=>{",ocr+"$('save').onclick=()=>{")

          s=s.replace("type:$('type').value,url,title,price:$('np').value.trim(),note:$('nn').value.trim(),","type:$('type').value,url,title,dates:$('nd').value.trim(),guests:$('ng').value.trim(),price:$('np').value.trim(),perPerson:$('npp').value.trim(),note:$('nn').value.trim(),cancellation:/free cancellation/i.test($('nn').value)?'Free cancellation':'',")

          s=re.sub(r"function resetForm\(\)\{.*?\}(?=document\.querySelectorAll\('\.chip'\))","function resetForm(){['link','nt','nd','ng','np','npp','nn'].forEach(id=>$(id).value='');draftImage='';draftSource='';$('status').className='status';$('linkPreview').classList.remove('show');screenshotFile=null;if(screenshotUrl){URL.revokeObjectURL(screenshotUrl);screenshotUrl=''}$('screenshot').value='';$('shotThumb').removeAttribute('src');$('shotBox').classList.remove('has');$('shotName').textContent='Choose screenshot';$('ocrBtn').disabled=true;$('ocrFound').classList.remove('show');$('ocrProgress').classList.remove('show');$('ocrBar').style.width='0%'}",s,count=1,flags=re.S)

          p.write_text(s)

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add screenshot price parsing"
          git push
