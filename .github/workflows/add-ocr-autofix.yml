name: Add OCR autofix reference

on:
  push:
    paths:
      - '.github/workflows/add-ocr-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add OCR autofix script reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="./ocr-autofix.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Auto-read booking screenshot after upload"
          git push
