<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Direct SerpApi flight test</title><style>:root{--ink:#222;--muted:#717171;--line:#e8e8e8;--pink:#ff385c;--pink2:#e31c5f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff}.app{max-width:720px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 60px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--pink2)}h1{font-size:32px;line-height:1.05;margin:8px 0 10px}.intro{color:var(--muted);line-height:1.5}.card{border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:850;margin:0 0 6px;color:#666}.field input{width:100%;border:1px solid #d8d8d8;border-radius:14px;padding:13px;font:inherit}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;margin-top:14px;font-weight:900;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff}.btn[disabled]{opacity:.55}.status,.err{display:none;margin-top:12px;border-radius:14px;padding:12px;font-size:13px;line-height:1.4}.status.show{display:block;background:#f5f7f8;color:#555}.err.show{display:block;background:#fff1f1;color:#a22}.results{display:grid;gap:12px;margin-top:14px}.flight{border:1px solid var(--line);border-radius:18px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.price{font-size:22px;font-weight:900}.route{font-weight:850}.meta{margin-top:7px;color:#666;font-size:12px;line-height:1.45}.pill{display:inline-block;margin-top:8px;border-radius:999px;padding:6px 9px;background:#f6f6f6;font-size:10px;font-weight:800}.good{background:#eefaf3;color:#24613e}.bad{background:#fff2f4;color:#b21f43}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#111;color:#fff;padding:12px;border-radius:14px;overflow:auto}details{margin-top:14px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="eyebrow">Holiday2027 · diagnostic</div><h1>Direct SerpApi test</h1><p class="intro">This bypasses Gemini completely. It only checks whether our Supabase backend can talk to SerpApi and return structured Google Flights results.</p><section class="card"><div class="grid"><div class="field"><label>From</label><input id="from" value="GLA"></div><div class="field"><label>To</label><input id="to" value="MLA"></div><div class="field"><label>Outbound</label><input id="out" type="date" value="2027-05-05"></div><div class="field"><label>Return</label><input id="ret" type="date" value="2027-05-12"></div></div><button id="go" class="btn">Run direct API test</button><div id="status" class="status"></div><div id="err" class="err"></div></section><section id="result" class="card" style="display:none"><div id="summary"></div><div id="results" class="results"></div><details><summary>Raw JSON</summary><pre id="raw"></pre></details></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://bpqmcjbnaukbejznzqwr.supabase.co',KEY='sb_publishable_pxoVfbfSnRRU3nFr-FHzfA_3GOJQxId',FN=URL+'/functions/v1/search-flights';const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let sp=null;async function session(){if(sp)return sp;sp=(async()=>{const {data:c}=await sb.auth.getSession();if(c?.session)return c.session;const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;return data.session})();try{return await sp}catch(e){sp=null;throw e}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sym(c){return c==='GBP'?'£':c==='EUR'?'€':c==='USD'?'$':c+' '}function render(d){$('result').style.display='block';$('summary').innerHTML=`<b>${d.result_count||0} results</b> · ${esc(d.engine||'google_flights')} · ${d.elapsed_ms||0} ms`;$('results').innerHTML=(d.results||[]).slice(0,12).map(x=>`<div class="flight"><div class="top"><div><div class="route">${esc((x.departure_airport||$('from').value)+' → '+(x.arrival_airport||$('to').value))}</div><div class="meta">${esc([x.airline,x.flight_number,x.departure_time&&x.arrival_time?x.departure_time+' → '+x.arrival_time:null,x.total_duration?x.total_duration+' min':null,x.stops!=null?x.stops+' stop'+(x.stops===1?'':'s'):null].filter(Boolean).join(' · '))}</div></div><div class="price">${sym(x.currency||'GBP')}${Number(x.price||0).toLocaleString('en-GB')}</div></div>${x.within_budget===true?'<span class="pill good">Within £100</span>':x.within_budget===false?'<span class="pill bad">Over £100</span>':''}</div>`).join('')||'<div class="flight">No flight cards returned.</div>';$('raw').textContent=JSON.stringify(d,null,2)}$('go').onclick=async()=>{const btn=$('go');btn.disabled=true;$('status').textContent='Calling Supabase → SerpApi → Google Flights…';$('status').classList.add('show');$('err').classList.remove('show');$('result').style.display='none';try{const s=await session();const plan={mode:'exact',engine:'google_flights',max_price_preference:100,params:{engine:'google_flights',departure_id:$('from').value.trim().toUpperCase(),arrival_id:$('to').value.trim().toUpperCase(),outbound_date:$('out').value,return_date:$('ret').value,currency:'GBP',gl:'uk',hl:'en',adults:'1',children:'0',type:'1',sort_by:'2',deep_search:'true'}};const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':KEY},body:JSON.stringify({serpapi_plan:plan})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);render(d);$('status').textContent='Direct API call completed.'}catch(e){$('err').textContent=e.message||String(e);$('err').classList.add('show')}finally{btn.disabled=false}};</script></body></html>
